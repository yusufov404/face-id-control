# FaceSys Enterprise — Nginx site configuration (HTTP on the LAN).
#
# Install to /etc/nginx/sites-available/facesys.conf and symlink into
# sites-enabled. Add TLS (see docs/INSTALL.md) before exposing the system
# outside the clinic network.
#
# Static React SPA build: /opt/facesys/frontend/dist
# API backend:            127.0.0.1:8000 (uvicorn, single worker)
# Upstream port is intentionally bound to loopback only.

upstream facesys_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/facesys/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Do not let browsers cache HTML (SPA updates must be picked up).
    add_header Cache-Control "no-store" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Health check for monitoring / auto-start verification.
    location = /health {
        proxy_pass http://facesys_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://facesys_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Static assets. No add_header/expires here on purpose: defining add_header
    # in a location cancels inheritance of the security headers above. Assets
    # therefore follow the server-level no-store policy (safe, slightly slower).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
    }

    # React Router SPA: any unknown path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never expose dotfiles or the docs folder through the web root.
    location ~ /\. {
        deny all;
    }
}
