name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  TEST_DATABASE_HOST: 127.0.0.1
  TEST_DATABASE_PORT: 5432
  TEST_DATABASE_NAME: facesys_test
  TEST_DATABASE_USER: postgres
  TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: facesys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d facesys_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Create virtual environment
        working-directory: backend
        run: python -m venv .venv
      - name: Install dependencies
        working-directory: backend
        run: .venv/bin/pip install -r requirements.txt
      - name: Run Alembic migrations
        working-directory: database/migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: facesys_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          SECRET_KEY: "test_secret_key_that_is_at_least_32_characters_long"
          REFRESH_SECRET_KEY: "test_refresh_secret_key_that_is_at_least_32_characters_long"
        run: .venv/bin/alembic upgrade head
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_NAME: facesys_test
          TEST_DATABASE_USER: postgres
          TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: .venv/bin/python -m pytest -q

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeCheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  alembic-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: facesys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d facesys_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Create virtual environment
        working-directory: backend
        run: python -m venv .venv
      - name: Install dependencies
        working-directory: backend
        run: .venv/bin/pip install -r requirements.txt
      - name: Alembic check
        working-directory: database/migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: facesys_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          SECRET_KEY: "test_secret_key_that_is_at_least_32_characters_long"
          REFRESH_SECRET_KEY: "test_refresh_secret_key_that_is_at_least_32_characters_long"
        run: .venv/bin/alembic check